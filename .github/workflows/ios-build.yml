name: iOS Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test UniSchedule iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Run Tests in Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | jq -r '.devices[] | map(select(.name | test("iPhone")))[0].udid' | grep -v null | head -n 1)
          if [ -z "$SIM_ID" ]; then
            DEST="platform=iOS Simulator,name=iPhone 15"
          else
            DEST="platform=iOS Simulator,id=$SIM_ID"
          fi
          echo "Using destination: $DEST"
          
          xcodebuild test \
            -project UniSchedule.xcodeproj \
            -scheme UniScheduleTests \
            -destination "$DEST" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Application for Device (Generic iOS)
        run: |
          xcodebuild build \
            -project UniSchedule.xcodeproj \
            -scheme UniSchedule \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO
